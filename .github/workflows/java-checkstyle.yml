# Superseded: Java Checkstyle now runs fail-fast as the first step inside the
# unified `openmetadata-service-unit-tests` workflow (zero duplicate Maven/JDK
# runner startup). This workflow stays as a 0-runner skipped stub only so the
# existing `java-checkstyle` required status check in GitHub's `merge-rules`
# ruleset resolves cleanly until the ruleset drops `java-checkstyle`.
name: Java Checkstyle

on:
  merge_group:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  java-checkstyle:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Java checkstyle runs inside openmetadata-service-unit-tests.yml"
