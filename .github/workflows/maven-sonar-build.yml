# Runs static analysis on main pushes, nightly, and manual dispatch — removed from
# pull_request to eliminate a redundant 6-minute full Maven build per PR and its
# PR-scoped ~/.m2 cache saves (ADR:2026-11-11-pull-request-jobs-restore-caches-but-never-save-them).
name: Maven SonarCloud CI

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"
  push:
    branches:
      - main
    paths:
      - "openmetadata-service/**"
      - "openmetadata-spec/src/main/resources/json/schema/**"
      - "openmetadata-dist/**"
      - "openmetadata-clients/**"
      - "openmetadata-sdk/**"
      - "common/**"
      - "pom.xml"
      - "Makefile"
      - "bootstrap/**"

permissions:
  contents: read
  packages: read

concurrency:
  group: maven-sonar-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  maven-sonarcloud-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Hydrate Maven dependencies
        id: maven-cache
        uses: ./.github/actions/hydrate-maven-cache

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev python3-venv librdkafka-dev gcc libsasl2-dev build-essential libssl-dev libffi-dev \
          librdkafka-dev unixodbc-dev libevent-dev jq
          sudo make install_antlr_cli

      - name: Restore openmetadata-ui dist cache
        uses: ./.github/actions/cache-ui-dist

      - name: Build with Maven
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B -T 1C -Pstatic-code-analysis clean verify -DskipTests -am

      - name: Save Maven dependencies
        if: github.event_name == 'push' && steps.maven-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.m2
          key: ${{ steps.maven-cache.outputs.cache-primary-key }}
